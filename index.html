<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beary's Inventario 🐻</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffdce8;
    color: #4b3028;
}

/* Decoración superior */
body::before {
    content: "🐻  ☕  🐻  ☕  🐻  ☕  🐻  ☕  🐻  ☕  🐻  ";
    display: block;
    text-align: center;
    font-size: 18px;
    letter-spacing: 6px;
    padding: 12px 0 3px;
    opacity: .7;
}

.contenedor {
    width: 94%;
    max-width: 650px;
    margin: auto;
    padding: 5px 0 35px;
}

/* ENCABEZADO */

h1 {
    text-align: center;
    margin: 5px 0 4px;
    font-size: 30px;
    color: #5b372d;
    font-weight: 800;
}

.subtitulo {
    text-align: center;
    color: #8c6258;
    margin: 0 0 7px;
    font-size: 14px;
}

/* FECHA */

.fecha {
    text-align: center;
    color: #a06d7e;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 16px;
}

/* BUSCADOR */

.buscador {
    position: relative;
    margin-bottom: 17px;
}

.buscador input {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 45px;
    border: 2px solid #edbfd0;
    border-radius: 16px;
    background: #fffafc;
    color: #5b372d;
    font-size: 16px;
    outline: none;
    box-shadow: 0 4px 10px rgba(111, 70, 60, .08);
    transition: .2s;
}

.buscador input::placeholder {
    color: #b99aa4;
}

.buscador input:focus {
    border-color: #d98da8;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(217, 141, 168, .18);
}

.icono-busqueda {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 19px;
    pointer-events: none;
}

/* TARJETAS */

.area {
    background: #fffaf5;
    border-radius: 22px;
    padding: 15px;
    margin-bottom: 17px;
    border: 2px solid #f1c4d2;
    box-shadow: 0 5px 14px rgba(111, 70, 60, .10);
    overflow: hidden;
}

.area h2 {
    margin: 0 -15px 10px;
    padding: 13px 15px;
    font-size: 20px;
    color: #5b372d;
    background: #f9e5d9;
    border-bottom: 2px dashed #e7b9a9;
}

/* Colores por sección */

#gris .area h2 {
    background: #eadfd9;
}

#morado .area h2 {
    background: #f6dbe5;
}

#comida .area h2 {
    background: #f9e2cf;
}

/* PRODUCTOS */

.producto {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 2px;
    border-bottom: 1px dashed #ead5ce;
}

.producto:last-child {
    border-bottom: none;
}

.nombre {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    color: #5a4038;
}

.meta {
    display: block;
    color: #a1847b;
    font-size: 11px;
    font-weight: normal;
    margin-top: 3px;
}

/* INPUTS */

input {
    width: 78px;
    height: 43px;
    border: 2px solid #e4c3bb;
    border-radius: 13px;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    color: #5b372d;
    background: #fff;
    outline: none;
    transition: .2s;
}

input::placeholder {
    color: #c5aaa2;
    font-weight: normal;
}

input:focus {
    border-color: #d98da8;
    background: #fff5f8;
    box-shadow: 0 0 0 3px rgba(217, 141, 168, .18);
}

/* BOTONES */

.boton {
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 15px;
    font-size: 17px;
    font-weight: bold;
    background: #70483b;
    color: white;
    margin-top: 4px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(92, 54, 43, .18);
    transition: transform .15s, box-shadow .15s;
}

.boton:active {
    transform: scale(.98);
    box-shadow: 0 2px 5px rgba(92, 54, 43, .15);
}

.boton.limpiar {
    background: #e28da8;
    margin-top: 10px;
}

/* MENSAJE */

#mensaje {
    text-align: center;
    margin-top: 14px;
    font-weight: bold;
    color: #70483b;
    min-height: 22px;
}

/* RESULTADO */

#resultado {
    width: 100%;
    min-height: 130px;
    margin-top: 12px;
    padding: 13px;
    border: 2px solid #edc4d1;
    border-radius: 15px;
    font-size: 16px;
    color: #5b372d;
    background: #fffafc;
    resize: vertical;
    display: none;
    outline: none;
}

/* ANIMACIÓN CENTRAL DEL OSITO */

#animacionOso {
    position: fixed;
    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    z-index: 9999;

    background: rgba(255, 250, 252, .97);

    border: 3px solid #f1c4d2;

    border-radius: 28px;

    padding: 25px 35px;

    text-align: center;

    box-shadow:
        0 12px 35px rgba(92, 54, 43, .25);

    opacity: 0;

    pointer-events: none;
}

#animacionOso.mostrar {
    animation: aparecerOso 1.5s ease forwards;
}

.osoAnimado {
    font-size: 65px;
    line-height: 1;

    animation: brincarOso 1.5s ease;
}

.textoOso {
    margin-top: 12px;
    font-size: 17px;
    font-weight: bold;
    color: #70483b;
}

/* APARECER Y DESAPARECER */

@keyframes aparecerOso {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.3);
    }

    20% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.12);
    }

    35% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    75% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.85);
    }
}

/* BRINQUITO DEL OSO */

@keyframes brincarOso {

    0% {
        transform:
            translateY(15px)
            rotate(-8deg);
    }

    25% {
        transform:
            translateY(-10px)
            rotate(8deg);
    }

    45% {
        transform:
            translateY(0)
            rotate(-5deg);
    }

    65% {
        transform:
            translateY(-5px)
            rotate(4deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0);
    }
}

/* PIE */

.contenedor::after {
    content: "♡Beary's Coffee Shop♡";
    display: block;
    text-align: center;
    color: #9b6c61;
    font-size: 12px;
    margin-top: 20px;
}

/* CELULAR */

@media (max-width: 480px) {

    body::before {
        font-size: 16px;
        letter-spacing: 4px;
    }

    .contenedor {
        width: 96%;
        padding-top: 4px;
    }

    h1 {
        font-size: 27px;
    }

    .subtitulo {
        font-size: 13px;
        padding: 0 8px;
    }

    .fecha {
        font-size: 12px;
    }

    .buscador input {
        height: 46px;
    }

    .area {

        border-radius: 19px;
    }

    .area h2 {

        margin-right: -12px;
        padding: 12px;
        font-size: 18px;
    }

    .producto {
        padding: 10px 0;
    }

    .nombre {
        font-size: 15px;
    }

    input {
        width: 74px;
        height: 42px;
    }

    .boton {
        padding: 15px 10px;
    }
}
</style>
</head>

/* FECHA */

function mostrarFecha() {

    const fecha = new Date();

    const opciones = {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    };

    let texto =
        fecha.toLocaleDateString(
            "es-MX",
            opciones
        );

    texto =
        texto.charAt(0).toUpperCase() +
        texto.slice(1);

    document.getElementById(
        "fecha"
    ).textContent =
        "📅 " + texto;
}

mostrarFecha();


/* NÚMERO BONITO */

function numeroBonito(numero) {

    if (Number.isInteger(numero)) {
        return numero;
    }

    return Number(
        numero.toFixed(2)
    );
}

                    "producto";

                const nombre =
                    document.createElement(
                        "div"
                    );

                nombre.className =
                    "nombre";

                nombre.textContent =
                    producto.name;

                const meta =
                    document.createElement(
                        "span"
                    );

                meta.className =
                    "meta";

                meta.textContent =
                    "Meta: " +
                    numeroBonito(
                        producto.target
                    );

                nombre.appendChild(meta);

                const input =
                    document.createElement(
                        "input"
                    );

                input.type = "number";

                input.min = "0";

                input.step = "any";

                input.inputMode =
                    "decimal";

                input.placeholder =
                    "Tengo";

                input.dataset.producto =
                    producto.name;

                input.dataset.objetivo =
                    producto.target;

                input.id =
                    "cantidad_" +
                    grupo +
                    "_" +
                    indice;

                const clave =
                    "inventarioFisico_v2_" +
                    input.id;

                const guardado =
                    localStorage.getItem(
                        clave
                    );

                if (
                    guardado !== null
                ) {

                    input.value =
                        guardado;
                }

                input.addEventListener(
                    "input",
                    function() {

                        if (
                            input.value === ""
                        ) {

                            localStorage.removeItem(
                                clave
                            );

                        } else {

                            localStorage.setItem(
                                clave,
                                input.value
                            );
                        }
                    }
                );

                fila.appendChild(
                    nombre
                );

                fila.appendChild(
                    input
                );

                area.appendChild(
                    fila
                );
            }
        );

    contenedor.appendChild(
        area
    );
}

);

/* BUSCADOR */

document
    .getElementById("buscador")
    .addEventListener(
        "input",
        function() {

            const busqueda =
                this.value
                    .toLowerCase()
                    .trim();

            document
                .querySelectorAll(
                    ".producto"
                )
                .forEach(
                    fila => {

                        const nombre =
                            fila
                                .querySelector(
                                    ".nombre"
                                )
                                .textContent
                                .toLowerCase();

                        if (
                            busqueda === "" ||
                            nombre.includes(
                                busqueda
                            )
                        ) {

                            fila.style.display =
                                "flex";

                        } else {

                            fila.style.display =
                                "none";
                        }
                    }
                );

            document
                .querySelectorAll(
                    ".area"
                )
                .forEach(
                    area => {

                        const productosVisibles =
                            Array.from(
                                area.querySelectorAll(
                                    ".producto"
                                )
                            ).some(
                                producto =>
                                    producto.style.display !==
                                    "none"
                            );

                        area.style.display =
                            productosVisibles
                                ? "block"
                                : "none";
                    }
                );
        }
    );


/* ANIMACIÓN OSO */

function mostrarAnimacionOso() {

    const oso =
        document.getElementById(
            "animacionOso"
        );

    oso.classList.remove(
        "mostrar"
    );

    void oso.offsetWidth;

    oso.classList.add(
        "mostrar"
    );

    setTimeout(
        () => {

            oso.classList.remove(
                "mostrar"
            );

        },
        1500
    );
}


/* GENERAR Y COPIAR */

function generarYCopiar() {

    let lista = [];

    document
        .querySelectorAll(
            "input[data-producto]"
        )
        .forEach(
            input => {

                if (
                    input.value === ""
                ) {
                    return;
                }

                const objetivo =
                    parseFloat(
                        input.dataset.objetivo
                    );

                const tengo =
                    parseFloat(
                        input.value
                    );

                if (
                    isNaN(objetivo) ||
                    isNaN(tengo)
                ) {
                    return;
                }

                const falta =
                    objetivo - tengo;

                if (
                    falta <= 0
                ) {
                    return;
                }

                lista.push(
                    numeroBonito(
                        falta
                    ) +
                    " " +
                    input.dataset.producto
                );
            }
        );

    const texto =
        lista.join("\n");

    const mensaje =
        document.getElementById(
            "mensaje"
        );

    const resultado =
        document.getElementById(
            "resultado"
        );


    if (
        texto === ""
    ) {

        mensaje.textContent =
            "🐻✨ No falta nada 😎";

        resultado.style.display =
            "none";

        return;
    }


    resultado.value =
        texto;

    resultado.style.display =
        "block";


    /*
     * Copiar automáticamente
     */

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(texto)
            .then(
                () => {

                    mensaje.textContent =
                        "🐻✨ Ya puedes pegarla en WhatsApp.";

                    mostrarAnimacionOso();

                }
            )
            .catch(
                () => {

                    copiarAlternativo(
                        texto,
                        mensaje
                    );

                }
            );

    } else {

        copiarAlternativo(
            texto,
            mensaje
        );
    }
}


/* COPIA ALTERNATIVA */

function copiarAlternativo(
    texto,
    mensaje
) {

    const resultado =
        document.getElementById(
            "resultado"
        );

    resultado.style.display =
        "block";

    resultado.focus();

    resultado.select();

    try {

        document.execCommand(
            "copy"
        );

        mensaje.textContent =
            "🐻✨ Ya puedes pegarla en WhatsApp.";

        mostrarAnimacionOso();

    } catch (e) {

        mensaje.textContent =
            "📋 La lista está abajo; mantenla presionada para copiarla.";
    }
}


/* NUEVA LISTA */

function nuevaLista() {

    if (
        !confirm(
            "¿Seguro que quieres borrar las cantidades y empezar una nueva lista?"
        )
    ) {

        return;
    }

    document
        .querySelectorAll(
            "input[data-producto]"
        )
        .forEach(
            input => {

                input.value = "";

                localStorage.removeItem(
                    "inventarioFisico_v2_" +
                    input.id
                );
            }
        );

    document.getElementById(
        "resultado"
    ).value = "";

    document.getElementById(
        "resultado"
    ).style.display =
        "none";

    document.getElementById(
        "mensaje"
    ).textContent =
        "🧹 Lista limpia. ¡Listo para el nuevo inventario! 🐻";
}
