<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beary's - Inventario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 15px;
        }

        h1 {
            text-align: center;
        }

        h2 {
            background-color: #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
        }

        .producto {
            background-color: white;
            margin: 6px 0;
            padding: 10px;
            border-radius: 8px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .producto input {
            width: 70px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #resultado {
            background-color: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h1>🐻 Beary's - Inventario</h1>

    <button onclick="generarLista()">📋 Generar lista</button>

        ];


        function mostrarProductos(lista, lugar) {

            const contenedor = document.getElementById(lugar);

            lista.forEach(function(producto) {

                contenedor.innerHTML += `
                    <div class="producto">
                        <span>${producto}</span>

                        <input 
                            type="number" 
                            min="0"
                            placeholder="Cantidad"
                            data-producto="${producto}"
                        >
                    </div>
                `;

            });

        }


        mostrarProductos(bebidas, "bebidas");
        mostrarProductos(comida, "comida");
        mostrarProductos(bodega, "bodega");
        mostrarProductos(limpieza, "limpieza");


        function generarLista() {

            let lista = "";

            const productos = document.querySelectorAll("input");

            productos.forEach(function(input) {

                if (input.value !== "") {

                    lista += input.dataset.producto + " " + input.value + "\n";

                }

            });

            document.getElementById("resultado").innerText = lista;

        }


        function copiarLista() {

            const texto = document.getElementById("resultado").innerText;

            navigator.clipboard.writeText(texto);

            alert("¡Lista copiada! 🐻");

        }

    </script>
